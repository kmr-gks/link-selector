name: Test and release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-26
          - platform: windows-x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            installer_arch: x64
          - platform: windows-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            installer_arch: arm64
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
          cache: npm
      - name: Read installer version
        id: version
        shell: bash
        run: |
          version=$(node -p 'require("./src-tauri/tauri.conf.json").version')
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Expected tag v$version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --no-self-update
      - name: Install the Windows Rust target
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: rustup target add --toolchain stable $env:RUST_TARGET
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Test release publishing
        shell: bash
        run: bash scripts/test-publish-release.sh

      - name: Test macOS packaging and signing setup
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bash scripts/test-package-macos.sh
          bash scripts/test-package-macos-ci.sh

      - run: cargo +stable fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Run Rust tests
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: |
          target_args=()
          if [[ -n "$RUST_TARGET" ]]; then
            target_args=(--target "$RUST_TARGET")
          fi
          cargo +stable test --manifest-path src-tauri/Cargo.toml --locked "${target_args[@]}"
      - name: Test Windows subprocess timeout
        if: runner.os == 'Windows'
        timeout-minutes: 3
        shell: pwsh
        run: ./scripts/test-windows-timeout.ps1
      - name: Test Firefox MSIX cleanup
        if: runner.os == 'Windows'
        timeout-minutes: 1
        shell: powershell
        run: ./scripts/test-windows-msix-cleanup.ps1
      - name: Test Firefox MSIX protocol activation
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: powershell
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: ./scripts/test-windows-msix.ps1

      - name: Build universal macOS app
        if: runner.os == 'macOS'
        run: |
          rustup default stable
          rustup target add x86_64-apple-darwin
          npm run tauri build -- --ci --target universal-apple-darwin --bundles app -- --locked
      - name: Package macOS disk image
        if: runner.os == 'macOS'
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          MACOS_REQUIRE_NOTARIZATION: ${{ github.ref_type == 'tag' && vars.MACOS_REQUIRE_NOTARIZATION || '' }}
          APPLE_CERTIFICATE: ${{ github.ref_type == 'tag' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ github.ref_type == 'tag' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_API_KEY: ${{ github.ref_type == 'tag' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_ISSUER: ${{ github.ref_type == 'tag' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY_BASE64: ${{ github.ref_type == 'tag' && secrets.APPLE_API_KEY_BASE64 || '' }}
        run: |
          bash scripts/package-macos-ci.sh \
            'src-tauri/target/universal-apple-darwin/release/bundle/macos/Link Selector.app' \
            "release/Link-Selector-macOS-$APP_VERSION-universal.dmg"

      - name: Build and test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          RUST_TARGET: ${{ matrix.target }}
          INSTALLER_ARCH: ${{ matrix.installer_arch }}
        run: |
          rustup default stable
          npm run tauri build -- --ci --target $env:RUST_TARGET --bundles nsis -- --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installers = @(Get-ChildItem "src-tauri/target/$env:RUST_TARGET/release/bundle/nsis/*-setup.exe")
          if ($installers.Count -ne 1) { throw 'Expected one NSIS installer' }
          & ./scripts/test-windows-installer.ps1 -Installer $installers[0].FullName -Architecture $env:INSTALLER_ARCH
          New-Item -ItemType Directory release -Force | Out-Null
          Copy-Item $installers[0].FullName "release/Link-Selector-Windows-${env:APP_VERSION}-${env:INSTALLER_ARCH}-setup.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: release/*
          if-no-files-found: error
          overwrite: true

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: release
        run: |
          bash ../scripts/publish-release.sh "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" \
            "../release-notes/$GITHUB_REF_NAME.md"
