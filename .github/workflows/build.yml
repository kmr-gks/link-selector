name: Test and build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Shared checks
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Read installer version
        id: version
        run: |
          version=$(jq -er '.version' src-tauri/tauri.conf.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Test release scripts
        run: |
          bash scripts/test-publish-release.sh
          bash scripts/test-find-release-build.sh
      - run: rustup toolchain install stable --profile minimal --component rustfmt --no-self-update
      - run: cargo +stable fmt --manifest-path src-tauri/Cargo.toml --check
      - uses: actions/upload-artifact@v7
        with:
          name: frontend
          path: dist/
          if-no-files-found: error
          overwrite: true

  build:
    needs: checks
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-26
          - platform: windows-x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            installer_arch: x64
          - platform: windows-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            installer_arch: arm64
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
          cache: npm
      - uses: actions/download-artifact@v8
        with:
          name: frontend
          path: dist
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Install the Intel macOS Rust target
        if: runner.os == 'macOS'
        run: rustup target add --toolchain stable x86_64-apple-darwin
      - name: Install the Windows Rust target
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: rustup target add --toolchain stable $env:RUST_TARGET
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.platform }}
          cache-bin: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: npm ci

      - name: Test macOS packaging and signing setup
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bash scripts/test-package-macos.sh
          bash scripts/test-package-macos-ci.sh

      - name: Run Rust tests
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: |
          target_args=()
          if [[ -n "$RUST_TARGET" ]]; then
            target_args=(--target "$RUST_TARGET")
          fi
          cargo +stable test --manifest-path src-tauri/Cargo.toml --locked "${target_args[@]}"
      - name: Test WebView2 policy restoration
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-webview2-policy.ps1
      - name: Test Windows subprocess timeout
        if: runner.os == 'Windows'
        timeout-minutes: 3
        shell: pwsh
        run: ./scripts/test-windows-timeout.ps1
      - name: Test Firefox MSIX cleanup
        if: runner.os == 'Windows'
        timeout-minutes: 1
        shell: powershell
        run: ./scripts/test-windows-msix-cleanup.ps1
      - name: Test Firefox MSIX protocol activation
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: powershell
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: ./scripts/test-windows-msix.ps1

      - name: Build universal macOS app
        if: runner.os == 'macOS'
        run: npm run tauri build -- --ci --config src-tauri/tauri.ci.conf.json --target universal-apple-darwin --bundles app -- --locked
      - name: Package macOS disk image
        if: runner.os == 'macOS'
        env:
          APP_VERSION: ${{ needs.checks.outputs.version }}
        run: |
          app='src-tauri/target/universal-apple-darwin/release/bundle/macos/Link Selector.app'
          bash scripts/package-macos.sh "$app" "release/Link-Selector-macOS-$APP_VERSION-universal.dmg" --adhoc
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            ditto -c -k --sequesterRsrc --keepParent "$app" macos-app.zip
          fi
      - uses: actions/upload-artifact@v7
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        with:
          name: macos-app
          path: macos-app.zip
          if-no-files-found: error
          overwrite: true

      - name: Build and test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          APP_VERSION: ${{ needs.checks.outputs.version }}
          RUST_TARGET: ${{ matrix.target }}
          INSTALLER_ARCH: ${{ matrix.installer_arch }}
        run: |
          npm run tauri build -- --ci --config src-tauri/tauri.ci.conf.json --target $env:RUST_TARGET --bundles nsis -- --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installers = @(Get-ChildItem "src-tauri/target/$env:RUST_TARGET/release/bundle/nsis/*-setup.exe")
          if ($installers.Count -ne 1) { throw 'Expected one NSIS installer' }
          & ./scripts/test-windows-installer.ps1 -Installer $installers[0].FullName -Architecture $env:INSTALLER_ARCH
          New-Item -ItemType Directory release -Force | Out-Null
          Copy-Item $installers[0].FullName "release/Link-Selector-Windows-${env:APP_VERSION}-${env:INSTALLER_ARCH}-setup.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error
          overwrite: true
