[package]
name = "link-selector"
version = "0.2.1"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }

[target.'cfg(target_os = "macos")'.dependencies]
base64 = "0.22"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSWorkspace", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSPasteboard", "std"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSArray", "NSBundle", "NSData", "NSDictionary", "NSString", "NSURL", "std"] }

[target.'cfg(target_os = "windows")'.dependencies]
clipboard-win = "5"
tauri-plugin-single-instance = "2"
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_System_Environment", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "windows")'.dev-dependencies]
tempfile = "3"
